services:

  nginx:
    image: nginx:alpine
    container_name: trainee-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build: ./app
    container_name: trainee-app
    expose:
      - "5000"

  db:
    image: postgres:16-alpine
    container_name: trainee-db
    environment:
      POSTGRES_DB: trainee_db
      POSTGRES_USER: trainee
      POSTGRES_PASSWORD: trainee123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  node-exporter:
    image: prom/node-exporter:latest
    container_name: trainee-node-exporter

  prometheus:
    image: prom/prometheus:latest
    container_name: trainee-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node-exporter


volumes:
  postgres_data:

